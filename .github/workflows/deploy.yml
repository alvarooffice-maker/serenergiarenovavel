name: Publicar site (VPS)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Enviar para a VPS
        env:
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "179.197.80.94 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINZhEKlUK2skTP2kWHTx/TtIodvfZh8ot2Drm1csRHyU" > ~/.ssh/known_hosts
          tar -czf - -C dist . | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@179.197.80.94
      - name: Conferir no ar
        run: curl -fsS https://serenergiarenovavel.com.br/ | grep -q "site-lead"
