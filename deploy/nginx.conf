server {
  listen 80;
  server_name _;
  root /site/atual;
  index index.html;
  gzip on; gzip_types text/css application/javascript image/svg+xml application/json; gzip_min_length 1024;
  error_page 404 /404.html;
  location / { try_files $uri $uri/index.html $uri.html =404; add_header Cache-Control "no-cache" always; include /etc/nginx/seguranca.inc; }
  # capas do Instagram: o servidor da API grava aqui e o site só lê
  location ^~ /instagram/ { alias /instagram/; add_header Cache-Control "no-cache" always; include /etc/nginx/seguranca.inc; location ~ /\. { deny all; } }
  location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable" always; include /etc/nginx/seguranca.inc; }
  location ~* \.(jpg|jpeg|png|webp|svg|mp4|ico|woff2)$ { add_header Cache-Control "public, max-age=604800" always; include /etc/nginx/seguranca.inc; }
}
