name: siteser
services:
  site:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - /opt/site-ser:/site:ro
      - /opt/site-ser/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/site-ser/config/seguranca.inc:/etc/nginx/seguranca.inc:ro
    networks: [coolify]
    mem_limit: 128m
networks:
  coolify: { external: true }
